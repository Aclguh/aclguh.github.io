<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#6366f1">
    <title>课程表 - Class Schedule</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- SheetJS 用于解析 .xls 文件 -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
</head>
<body>

    <!-- 图标库（内联 SVG，无 emoji / 图标字体依赖） -->
    <svg class="svg-sprite" aria-hidden="true" focusable="false">
        <symbol id="i-calendar" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4.5" width="18" height="16.5" rx="3"/><path d="M8 2.5v4M16 2.5v4M3 10h18"/>
        </symbol>
        <symbol id="i-grid" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="2"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="2"/>
        </symbol>
        <symbol id="i-list" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <path d="M8 6h12M8 12h12M8 18h12"/><circle cx="3.6" cy="6" r="1.3"/><circle cx="3.6" cy="12" r="1.3"/><circle cx="3.6" cy="18" r="1.3"/>
        </symbol>
        <symbol id="i-clipboard" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M9 12h6M9 16h4"/>
        </symbol>
        <symbol id="i-download" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/>
        </symbol>
        <symbol id="i-clock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="9"/><path d="M12 7v5.2l3.4 2"/>
        </symbol>
        <symbol id="i-trash" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M6 6l1 14h10l1-14"/><path d="M10 11v5M14 11v5"/>
        </symbol>
        <symbol id="i-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 5v14M5 12h14"/>
        </symbol>
        <symbol id="i-close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 6 6 18M6 6l12 12"/>
        </symbol>
        <symbol id="i-target" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="1.2" fill="currentColor" stroke="none"/>
        </symbol>
        <symbol id="i-book" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H19v14.5H6.5A2.5 2.5 0 0 0 4 20z"/><path d="M4 20a2 2 0 0 1 2.5-2"/>
        </symbol>
        <symbol id="i-user" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="8" r="3.6"/><path d="M4.8 20.2a7.6 7.6 0 0 1 14.4 0"/>
        </symbol>
        <symbol id="i-pin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 21.5s7-6.1 7-11.1a7 7 0 1 0-14 0c0 5 7 11.1 7 11.1z"/><circle cx="12" cy="10.2" r="2.6"/>
        </symbol>
        <symbol id="i-coffee" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 8h12v5.5a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5z"/><path d="M16 9.5h1.8a2.7 2.7 0 0 1 0 5.4H16"/><path d="M6.5 4.2c0 .8.8.9.8 1.8M10 4.2c0 .8.8.9.8 1.8"/>
        </symbol>
        <symbol id="i-clipboard-list" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 4H7a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2h-2"/><rect x="9" y="2.2" width="6" height="3.6" rx="1.2"/><path d="M9 11h6M9 15h4"/>
        </symbol>
        <symbol id="i-skip-back" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18.5 6v12L9 12z" fill="currentColor" stroke="none"/><path d="M6.5 5.5v13"/>
        </symbol>
        <symbol id="i-skip-fwd" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5.5 6v12L15 12z" fill="currentColor" stroke="none"/><path d="M17.5 5.5v13"/>
        </symbol>
        <symbol id="i-chev-left" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m14.5 6-6 6 6 6"/>
        </symbol>
        <symbol id="i-chev-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m9.5 6 6 6-6 6"/>
        </symbol>
    </svg>

    <!-- 顶部导航栏 -->
    <header class="header">
        <div class="header-inner">
            <h1 class="logo">
                <span class="logo-icon" aria-hidden="true"><svg><use href="#i-calendar"/></svg></span>
                <span class="logo-text">课程表</span>
            </h1>
            <div class="header-actions">
                <button class="btn btn-outline" id="btn-template" title="下载CSV导入模板">
                    <span class="btn-icon" aria-hidden="true"><svg><use href="#i-clipboard"/></svg></span><span class="btn-text">模板</span>
                </button>
                <button class="btn btn-outline" id="btn-import" title="导入课程表">
                    <span class="btn-icon" aria-hidden="true"><svg><use href="#i-download"/></svg></span><span class="btn-text">导入</span>
                </button>
                <button class="btn btn-outline" id="btn-settings" title="自定义节数与每节上课时间">
                    <span class="btn-icon" aria-hidden="true"><svg><use href="#i-clock"/></svg></span><span class="btn-text">时间</span>
                </button>
                <button class="btn btn-outline btn-clear" id="btn-clear" title="清空课程表">
                    <span class="btn-icon" aria-hidden="true"><svg><use href="#i-trash"/></svg></span><span class="btn-text">清空</span>
                </button>
            </div>
        </div>
    </header>

    <main class="main-container">
        <!-- 学期信息栏 -->
        <section class="info-bar" id="info-bar">
            <!-- 动态渲染 -->
        </section>

        <!-- 周导航栏 -->
        <section class="week-nav" id="week-nav">
            <!-- 动态渲染 -->
        </section>

        <!-- 本周统计 -->
        <section class="stats-bar" id="stats-bar">
            <!-- 动态渲染 -->
        </section>

        <!-- 表格工具栏：节数提示 + 视图切换 -->
        <div class="table-toolbar" id="table-toolbar">
            <span class="toolbar-hint" id="toolbar-hint"></span>
            <div class="view-toggle" id="view-toggle" role="group" aria-label="视图切换">
                <button type="button" id="btn-view-grid" title="周课表网格视图">
                    <span class="vt-icon" aria-hidden="true"><svg><use href="#i-grid"/></svg></span>周课表
                </button>
                <button type="button" id="btn-view-day" title="按天视图">
                    <span class="vt-icon" aria-hidden="true"><svg><use href="#i-list"/></svg></span>按天
                </button>
            </div>
        </div>

        <!-- 课程表格区域（周网格视图） -->
        <div class="schedule-wrapper" id="schedule-wrapper">
            <table class="schedule-table" id="schedule-table">
                <!-- 动态渲染 -->
            </table>
        </div>

        <!-- 按天视图（手机端主视图） -->
        <div class="day-view hidden" id="day-view">
            <div class="day-tabs" id="day-tabs">
                <!-- 动态渲染 -->
            </div>
            <div class="day-list" id="day-list">
                <!-- 动态渲染 -->
            </div>
        </div>

        <!-- 空状态 -->
        <div class="empty-state" id="empty-state">
            <div class="empty-icon" aria-hidden="true"><svg><use href="#i-clipboard-list"/></svg></div>
            <h2>还没有课程数据</h2>
            <p>点击右上角「模板」下载 CSV 模板，填写后「导入」</p>
            <button class="btn btn-primary btn-lg" id="btn-empty-import">
                <span class="btn-icon" aria-hidden="true"><svg><use href="#i-download"/></svg></span>导入课程表
            </button>
            <p class="empty-hint">支持 CSV 格式（推荐）以及 .xls / .xlsx 格式<br>导入后可在「时间」中自定义节数与上课时间</p>
        </div>
    </main>

    <!-- 导入确认对话框 -->
    <div class="modal-overlay hidden" id="confirm-overlay">
        <div class="modal modal-sm" role="dialog" aria-modal="true" aria-labelledby="confirm-title">
            <div class="modal-header">
                <h3 id="confirm-title">导入预览</h3>
            </div>
            <div class="modal-body">
                <div id="confirm-message"></div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline" id="confirm-cancel">取消</button>
                <button type="button" class="btn btn-primary" id="confirm-ok">确认导入</button>
            </div>
        </div>
    </div>

    <!-- 上课时间设置对话框 -->
    <div class="modal-overlay hidden" id="settings-overlay">
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="settings-title">
            <div class="modal-header">
                <h3 id="settings-title">
                    <span class="modal-title-icon" aria-hidden="true"><svg><use href="#i-clock"/></svg></span>
                    上课时间设置
                </h3>
            </div>
            <div class="modal-body">
                <p class="settings-hint">自定义节数与每节的上课时间，课程表会按下面的配置生成行。时间可以留空；导入课程时缺少的节次会自动补齐。</p>
                <div class="slot-list" id="slot-list">
                    <!-- 动态渲染 -->
                </div>
                <button type="button" class="btn btn-outline btn-add-slot" id="btn-add-slot">
                    <span class="btn-icon" aria-hidden="true"><svg><use href="#i-plus"/></svg></span>添加一节
                </button>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline" id="settings-cancel">取消</button>
                <button type="button" class="btn btn-primary" id="settings-save">保存设置</button>
            </div>
        </div>
    </div>

    <!-- Toast 消息 -->
    <div class="toast-container" id="toast-container"></div>

    <!-- 隐藏的文件输入 -->
    <input type="file" id="import-file-input" accept=".csv,.xls,.xlsx" class="hidden">

    <!-- JavaScript 模块 -->
    <script src="js/storage.js"></script>
    <script src="js/parser.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
