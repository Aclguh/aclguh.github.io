<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta
            http-equiv="Content-Security-Policy"
            content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; connect-src 'self'; font-src 'self' data:;"
        />
        <title>终末地武器库 - 智能筛选系统</title>
        <link rel="stylesheet" href="css/style.css" />
        <script src="../../shared/js/theme.js"></script>
    </head>
    <body>
        <header>
            <div class="header-inner-row">
                <a class="back-link" href="../../">‹ 返回首页</a>
                <div class="header-titles">
                    <h1>终末地武器库</h1>
                    <p class="subtitle">智能筛选系统 | 完美匹配验证</p>
                </div>
                <button
                    class="theme-btn"
                    id="theme-toggle"
                    type="button"
                    aria-label="切换深浅色主题"
                    title="切换深浅色主题"
                >
                    <svg
                        class="icon-moon"
                        viewBox="0 0 24 24"
                        width="18"
                        height="18"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                    >
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                    </svg>
                    <svg
                        class="icon-sun"
                        viewBox="0 0 24 24"
                        width="18"
                        height="18"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                    >
                        <circle cx="12" cy="12" r="5"></circle>
                        <line x1="12" y1="1" x2="12" y2="3"></line>
                        <line x1="12" y1="21" x2="12" y2="23"></line>
                        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                        <line x1="1" y1="12" x2="3" y2="12"></line>
                        <line x1="21" y1="12" x2="23" y2="12"></line>
                        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                    </svg>
                </button>
            </div>
        </header>

        <div class="container">
            <div class="main-section">
                <div class="mode-hint">
                    系统将遍历<strong>枢纽区、源石研究园、矿脉源区、供能高地、武陵城</strong>五个预设，自动找出包含完美匹配武器的最优筛选方案。
                </div>

                <div class="combo-inputs">
                    <div class="combo-select-group">
                        <label class="combo-select-label">基础属性</label>
                        <select class="combo-select" id="comboBasic" onchange="validateInput()">
                            <option value="">选择基础属性</option>
                        </select>
                    </div>
                    <div class="combo-select-group">
                        <label class="combo-select-label">附加属性</label>
                        <select class="combo-select" id="comboAdditional" onchange="validateInput()">
                            <option value="">选择附加属性</option>
                        </select>
                    </div>
                    <div class="combo-select-group">
                        <label class="combo-select-label">技能属性</label>
                        <select class="combo-select" id="comboSkill" onchange="validateInput()">
                            <option value="">选择技能属性</option>
                        </select>
                    </div>
                </div>

                <button class="simulate-btn" id="simulateBtn" onclick="runSimulation()" disabled>
                    请输入完整的目标三属性组合
                </button>

                <div class="result-panel" id="resultPanel"></div>
            </div>
        </div>

        <script src="../../shared/js/security.js"></script>
        <script src="../../shared/data/weapons.js"></script>
        <script src="js/app.js"></script>
    </body>
</html>
