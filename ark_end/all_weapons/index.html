<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta
            http-equiv="Content-Security-Policy"
            content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; connect-src 'self'; font-src 'self' data:;"
        />
        <title>终末地武器库 - 智能筛选系统</title>
        <link rel="stylesheet" href="../../shared/css/ui-kit.css" />
        <link rel="stylesheet" href="css/style.css" />
        <script src="../../shared/js/theme.js"></script>
    </head>
    <body>
        <header>
            <div class="header-inner-row">
                <a class="back-link" href="../../">‹ 返回首页</a>
                <div class="header-titles">
                    <h1>终末地武器库</h1>
                    <p class="subtitle">智能筛选系统 | 支持单选/多维复合筛选</p>
                </div>
                <button
                    class="theme-btn"
                    id="theme-toggle"
                    type="button"
                    aria-label="切换深浅色主题"
                    title="切换深浅色主题"
                >
                    <svg
                        class="icon-moon"
                        viewBox="0 0 24 24"
                        width="18"
                        height="18"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                    >
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                    </svg>
                    <svg
                        class="icon-sun"
                        viewBox="0 0 24 24"
                        width="18"
                        height="18"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                    >
                        <circle cx="12" cy="12" r="5"></circle>
                        <line x1="12" y1="1" x2="12" y2="3"></line>
                        <line x1="12" y1="21" x2="12" y2="23"></line>
                        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                        <line x1="1" y1="12" x2="3" y2="12"></line>
                        <line x1="21" y1="12" x2="23" y2="12"></line>
                        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                    </svg>
                </button>
            </div>
        </header>

        <div class="container">
            <!-- 模式切换 -->
            <div class="mode-tabs">
                <button class="mode-tab active" data-mode="standard">
                    标准模式
                    <span class="badge">单选</span>
                </button>
                <button class="mode-tab" data-mode="advanced">
                    高级模式
                    <span class="badge">多基础属性</span>
                </button>
            </div>

            <!-- 标准模式 -->
            <div id="standardMode" class="filter-section">
                <div class="mode-hint">
                    <strong>标准模式：</strong>点击属性筛选，再次点击已选属性可取消选择（回到全部）
                </div>

                <div class="filter-group">
                    <div class="filter-label">基础属性</div>
                    <div class="filter-options" id="basicFilterStandard"></div>
                </div>

                <div class="filter-group">
                    <div class="filter-label">附加属性</div>
                    <div class="filter-options" id="additionalFilterStandard"></div>
                </div>

                <div class="filter-group">
                    <div class="filter-label">技能属性</div>
                    <div class="filter-options" id="skillFilterStandard"></div>
                </div>
            </div>

            <!-- 高级模式 -->
            <div id="advancedMode" class="filter-section hidden">
                <div class="mode-hint">
                    <strong>高级模式：</strong
                    >可同时选择<b>最多3个基础属性</b>（多选），配合附加属性和技能属性进行精准筛选
                </div>

                <div class="filter-group">
                    <div class="filter-header">
                        <div class="filter-label">基础属性（多选）</div>
                        <div class="filter-count" id="basicCount">已选: 0/3</div>
                    </div>
                    <div class="filter-options" id="basicFilterAdvanced"></div>
                </div>

                <div class="filter-group">
                    <div class="filter-label">附加属性</div>
                    <div class="filter-options" id="additionalFilterAdvanced"></div>
                </div>

                <div class="filter-group">
                    <div class="filter-label">技能属性</div>
                    <div class="filter-options" id="skillFilterAdvanced"></div>
                </div>
            </div>

            <div class="stats-bar">
                <div class="stats-text">找到武器: <span class="stats-number" id="weaponCount">0</span> 件</div>
                <button class="clear-btn" id="clearBtn">清空当前筛选</button>
            </div>

            <div class="weapons-grid" id="weaponsGrid"></div>
        </div>

        <script src="../../shared/js/security.js"></script>
        <script src="../../shared/js/ui-kit.js"></script>
        <script src="../../shared/data/weapons.js"></script>
        <script src="js/app.js"></script>
    </body>
</html>
