<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#5b6ef5">
    <title>舒尔特方格</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- 图标库（内联 SVG，无 emoji / 图标字体依赖） -->
    <svg class="svg-sprite" aria-hidden="true" focusable="false">
        <symbol id="i-grid" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="7.5" height="7.5" rx="1.6"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="1.6"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="1.6"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="1.6"/>
        </symbol>
        <symbol id="i-play" viewBox="0 0 24 24" fill="currentColor">
            <path d="M8 5.14v13.72a1 1 0 0 0 1.52.85l10.7-6.86a1 1 0 0 0 0-1.7L9.52 4.29A1 1 0 0 0 8 5.14z"/>
        </symbol>
        <symbol id="i-refresh" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20.5 12a8.5 8.5 0 1 1-2.49-6.01"/><path d="M20.5 3.5V9H15"/>
        </symbol>
        <symbol id="i-clock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="9"/><path d="M12 7v5.2l3.2 1.9"/>
        </symbol>
        <symbol id="i-target" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4.6"/><circle cx="12" cy="12" r="1.2" fill="currentColor" stroke="none"/>
        </symbol>
        <symbol id="i-alert" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="9"/><path d="M12 7.5v5.2"/><path d="M12 16.4h.01"/>
        </symbol>
        <symbol id="i-trophy" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <path d="M7 4h10v5.5a5 5 0 0 1-10 0z"/><path d="M7 6H4v1.2A3.8 3.8 0 0 0 7 11"/><path d="M17 6h3v1.2A3.8 3.8 0 0 1 17 11"/><path d="M12 14.5V18"/><path d="M8.5 20.5h7l-1.2-3H9.7z"/>
        </symbol>
        <symbol id="i-list" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <path d="M8 6h12M8 12h12M8 18h12"/><circle cx="3.6" cy="6" r="1.3"/><circle cx="3.6" cy="12" r="1.3"/><circle cx="3.6" cy="18" r="1.3"/>
        </symbol>
        <symbol id="i-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 6 9 17l-5-5"/>
        </symbol>
        <symbol id="i-sparkles" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3l1.9 4.6L18.5 9.5l-4.6 1.9L12 16l-1.9-4.6L5.5 9.5l4.6-1.9z"/><path d="M18.5 15.5l.9 2.1 2.1.9-2.1.9-.9 2.1-.9-2.1-2.1-.9 2.1-.9z"/>
        </symbol>
        <symbol id="i-trash" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M6 6l1 14h10l1-14"/><path d="M10 11v5M14 11v5"/>
        </symbol>
        <symbol id="i-shield" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3l7 3.2v5.6c0 4.3-3 7.4-7 9.2-4-1.8-7-4.9-7-9.2V6.2z"/>
        </symbol>
    </svg>

    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="brand">
                <span class="brand-icon" aria-hidden="true"><svg><use href="#i-grid"/></svg></span>
                <span class="brand-text">
                    <h1>舒尔特方格</h1>
                    <p class="subtitle">按顺序点击数字，训练专注与视野</p>
                </span>
            </div>
        </header>

        <!-- Settings -->
        <section class="card">
            <h2 class="card-title">
                <span class="card-title-icon" aria-hidden="true"><svg><use href="#i-target"/></svg></span>
                训练设置
            </h2>
            <div class="settings-row">
                <div class="size-picker" id="sizePicker" role="group" aria-label="方格规格">
                    <button class="size-pill" data-size="3" type="button">3×3</button>
                    <button class="size-pill" data-size="4" type="button">4×4</button>
                    <button class="size-pill active" data-size="5" type="button">5×5</button>
                    <button class="size-pill" data-size="6" type="button">6×6</button>
                    <button class="size-pill" data-size="7" type="button">7×7</button>
                </div>
                <button class="btn btn-primary" id="startBtn" type="button">
                    <span class="btn-icon" aria-hidden="true"><svg><use href="#i-play"/></svg></span>开始训练
                </button>
            </div>

            <label class="toggle-row" for="markToggle">
                <span class="toggle-text-wrap">
                    <span class="toggle-text">标记已点数字</span>
                    <span class="toggle-hint">关闭后点中的数字不再高亮，更接近标准舒尔特训练</span>
                </span>
                <span class="switch">
                    <input type="checkbox" id="markToggle" checked>
                    <span class="switch-track" aria-hidden="true"></span>
                </span>
            </label>
        </section>

        <!-- Training -->
        <section class="card">
            <h2 class="card-title">
                <span class="card-title-icon" aria-hidden="true"><svg><use href="#i-grid"/></svg></span>
                训练区
            </h2>

            <div class="stats-grid stats-live">
                <div class="stat-item highlight">
                    <div class="stat-value" id="statNext">—</div>
                    <div class="stat-label">下一个</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="statTime">0.00</div>
                    <div class="stat-label">用时 (秒)</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="statErrors">0</div>
                    <div class="stat-label">点错次数</div>
                </div>
            </div>

            <div class="grid-wrap">
                <div class="grid idle" id="grid" aria-live="polite"></div>
                <div class="grid-overlay" id="gridOverlay"></div>
            </div>
        </section>

        <!-- Records -->
        <section class="card">
            <div class="card-title card-title-row">
                <h2 class="card-title-main">
                    <span class="card-title-icon" aria-hidden="true"><svg><use href="#i-trophy"/></svg></span>
                    最佳成绩
                </h2>
                <div class="card-title-actions">
                    <button class="btn btn-danger btn-sm" id="clearBtn" type="button">
                        <span class="btn-icon" aria-hidden="true"><svg><use href="#i-trash"/></svg></span>清空记录
                    </button>
                </div>
            </div>

            <div class="stats-grid" id="bestGrid"></div>

            <h3 class="sub-title">
                <span class="sub-title-icon" aria-hidden="true"><svg><use href="#i-list"/></svg></span>
                最近记录
            </h3>
            <div class="table-wrap" id="historyWrap"></div>
        </section>

        <footer class="footer">
            <span class="footer-icon" aria-hidden="true"><svg><use href="#i-shield"/></svg></span>
            数据存储在浏览器本地 · 不会上传到任何服务器
        </footer>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="js/app.js"></script>
</body>
</html>
