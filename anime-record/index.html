<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f6f7fb">
    <title>看番记录 - Anime Record</title>
    <script>
        (function () {
            var KEY = 'theme';
            var doc = document.documentElement;
            var mq = window.matchMedia('(prefers-color-scheme: dark)');
            var META = { light: '#f6f7fb', dark: '#0e1015' };

            function stored() {
                try { return localStorage.getItem(KEY); } catch (e) { return null; }
            }
            function apply(t, save) {
                doc.setAttribute('data-theme', t);
                if (save) { try { localStorage.setItem(KEY, t); } catch (e) {} }
                var meta = document.querySelector('meta[name="theme-color"]');
                if (meta) meta.setAttribute('content', META[t]);
            }

            var s = stored();
            apply(s === 'dark' || s === 'light' ? s : (mq.matches ? 'dark' : 'light'), false);

            document.addEventListener('DOMContentLoaded', function () {
                var btn = document.getElementById('theme-toggle');
                if (btn) btn.addEventListener('click', function () {
                    apply(doc.getAttribute('data-theme') === 'dark' ? 'light' : 'dark', true);
                    document.dispatchEvent(new CustomEvent('themechange'));
                });
            });

            // 未手动选择过时跟随系统明暗变化
            mq.addEventListener('change', function (e) {
                var t = stored();
                if (t !== 'dark' && t !== 'light') apply(e.matches ? 'dark' : 'light', false);
            });
        })();
    </script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- 顶部导航栏 -->
    <header class="header">
        <div class="header-inner">
            <h1 class="logo">
                <span class="logo-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="3"/><path d="M10 9l5 3-5 3z"/></svg>
                </span>
                <span class="logo-text">看番记录</span>
            </h1>
            <div class="header-actions">
                <button class="btn btn-outline" id="btn-template" title="下载导入模板">
                    <span class="btn-icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M9 12h6M9 16h4"/></svg>
                    </span>
                    <span class="btn-text">模板</span>
                </button>
                <button class="btn btn-outline" id="btn-import" title="导入数据">
                    <span class="btn-icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
                    </span>
                    <span class="btn-text">导入</span>
                </button>
                <button class="btn btn-outline" id="btn-export" title="导出数据">
                    <span class="btn-icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3"/><path d="m7 8 5-5 5 5"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
                    </span>
                    <span class="btn-text">导出</span>
                </button>
                <button class="btn btn-outline theme-btn" id="theme-toggle" type="button" title="切换深浅色主题" aria-label="切换深浅色主题">
                    <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5a8.5 8.5 0 1 0 11 11z"/></svg>
                    <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2.5M12 19.5V22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M2 12h2.5M19.5 12H22M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></svg>
                </button>
            </div>
        </div>
    </header>

    <main class="main-container">
        <!-- 统计概览栏 -->
        <section class="stats-bar" id="stats-bar">
            <!-- 动态渲染 -->
        </section>

        <!-- 工具栏 -->
        <section class="toolbar">
            <div class="toolbar-left">
                <div class="status-filters" id="status-filters" role="tablist" aria-label="观看状态筛选">
                    <button class="filter-btn" data-status="all">全部</button>
                    <button class="filter-btn" data-status="want_to_watch">想看</button>
                    <button class="filter-btn active" data-status="watching">在看</button>
                    <button class="filter-btn" data-status="watched">看过</button>
                    <button class="filter-btn" data-status="on_hold">搁置</button>
                    <button class="filter-btn" data-status="dropped">抛弃</button>
                </div>
            </div>
            <div class="toolbar-right">
                <div class="search-box">
                    <span class="search-icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2"/></svg>
                    </span>
                    <input type="text" id="search-input" placeholder="搜索番剧..." autocomplete="off">
                    <button class="search-clear hidden" id="search-clear" title="清空搜索" aria-label="清空搜索">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
                    </button>
                </div>
                <div class="select-wrap">
                    <select class="sort-select" id="sort-select" aria-label="排序方式">
                        <option value="">默认排序</option>
                    </select>
                    <span class="select-caret" aria-hidden="true">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
                    </span>
                </div>
                <button class="btn btn-primary" id="btn-add">
                    <span class="btn-icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
                    </span>
                    <span class="btn-text">添加番剧</span>
                </button>
            </div>
        </section>

        <!-- 周几筛选 -->
        <section class="week-filter" id="week-filter">
            <!-- 动态渲染 -->
        </section>

        <!-- 番剧列表 -->
        <section class="anime-grid" id="anime-grid">
            <!-- 动态渲染 -->
        </section>

        <!-- 空状态 -->
        <div class="empty-state hidden" id="empty-state">
            <div class="empty-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="3"/><path d="M10 9l5 3-5 3z"/></svg>
            </div>
            <h2>还没有番剧记录</h2>
            <p id="empty-message">点击「添加番剧」开始记录你的追番之旅吧！</p>
            <button class="btn btn-primary btn-lg" id="btn-add-empty">
                <span class="btn-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
                </span>
                <span class="btn-text">添加第一部番剧</span>
            </button>
        </div>

        <!-- 加载更多 -->
        <div class="load-more hidden" id="load-more">
            <button class="btn btn-outline" id="btn-load-more">加载更多</button>
        </div>
    </main>

    <!-- 添加/编辑番剧模态窗口 -->
    <div class="modal-overlay hidden" id="modal-overlay">
        <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
            <div class="modal-header">
                <h2 id="modal-title">添加番剧</h2>
                <button class="modal-close" id="modal-close" title="关闭" aria-label="关闭">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
                </button>
            </div>
            <div class="modal-body">
                <form id="anime-form" novalidate>
                    <input type="hidden" id="form-id">

                    <div class="form-group required">
                        <label for="form-title-zh">中文名称</label>
                        <input type="text" id="form-title-zh" placeholder="例：葬送的芙莉莲" required>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="form-status">观看状态</label>
                            <select id="form-status">
                                <option value="want_to_watch">想看</option>
                                <option value="watching">在看</option>
                                <option value="watched">看过</option>
                                <option value="on_hold">搁置</option>
                                <option value="dropped">抛弃</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="form-week">更新频率</label>
                            <select id="form-week">
                                <!-- 选项由 JS 填充 -->
                            </select>
                            <span class="form-hint">留空则不显示标记</span>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="form-ep-watched">已看集数</label>
                            <input type="number" id="form-ep-watched" min="0" value="0" placeholder="0">
                        </div>
                        <div class="form-group">
                            <label for="form-ep-total">总集数</label>
                            <input type="number" id="form-ep-total" min="0" value="0" placeholder="0（未知）">
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline" id="modal-cancel">取消</button>
                <button type="button" class="btn btn-danger hidden" id="modal-delete">
                    <span class="btn-icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M6 6l1 14h10l1-14"/></svg>
                    </span>
                    <span class="btn-text">删除</span>
                </button>
                <button type="button" class="btn btn-primary" id="modal-save">保存</button>
            </div>
        </div>
    </div>

    <!-- 确认对话框 -->
    <div class="modal-overlay hidden" id="confirm-overlay">
        <div class="modal modal-sm" id="confirm-modal" role="dialog" aria-modal="true" aria-labelledby="confirm-title">
            <div class="modal-header">
                <h3 id="confirm-title">确认操作</h3>
            </div>
            <div class="modal-body">
                <p id="confirm-message"></p>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline" id="confirm-cancel">取消</button>
                <button type="button" class="btn btn-danger" id="confirm-ok">确认</button>
            </div>
        </div>
    </div>

    <!-- Toast 消息 -->
    <div class="toast-container" id="toast-container"></div>

    <!-- 隐藏的文件输入 -->
    <input type="file" id="import-file-input" accept=".json" class="hidden">

    <!-- JavaScript -->
    <script src="js/models.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/form.js"></script>
    <script src="js/import-export.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
