<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aclguh's Workspace</title>
    <style>
        :root {
            --bg: #f6f7fb;
            --surface: #ffffff;
            --text: #1f2430;
            --text-secondary: #5a6478;
            --text-muted: #98a2b3;
            --border: #e6e8ef;
            --accent: #6366f1;
            --accent-deep: #4f46e5;
            --accent-light: #eef2ff;
            --green: #10b981;
            --green-bg: #ecfdf5;
            --amber: #f59e0b;
            --amber-bg: #fffbeb;
            --radius: 14px;
            --radius-sm: 10px;
            --shadow: 0 1px 2px rgba(16,24,40,.04), 0 1px 3px rgba(16,24,40,.06);
            --shadow-md: 0 6px 16px rgba(16,24,40,.08);
            --shadow-lg: 0 16px 40px rgba(99,102,241,.14);
            --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            --mono: 'SF Mono', 'Fira Code', 'Consolas', monospace;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        html { font-size: 16px; scroll-behavior: smooth; }

        body {
            font-family: var(--font);
            background:
                radial-gradient(1100px 520px at 85% -8%, rgba(99,102,241,.10), transparent 60%),
                radial-gradient(900px 480px at 8% -8%, rgba(168,85,247,.08), transparent 60%),
                var(--bg);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
        }

        /* ── Header ───────────────────── */
        .header {
            position: sticky;
            top: 0;
            z-index: 10;
            backdrop-filter: blur(12px);
            background: rgba(255,255,255,.72);
            border-bottom: 1px solid var(--border);
        }
        .header-inner {
            max-width: 840px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 60px;
            padding: 0 24px;
        }
        .header-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
        }
        .header-logo {
            width: 32px;
            height: 32px;
            border-radius: 9px;
            background: linear-gradient(135deg, var(--accent), #a855f7);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            box-shadow: 0 4px 12px rgba(99,102,241,.3);
        }
        .header-logo svg { width: 18px; height: 18px; }
        .header-name {
            font-weight: 700;
            font-size: 1.05rem;
            letter-spacing: -0.3px;
            color: var(--text);
        }
        .header-name span { color: var(--accent); }
        .header-gh {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.85rem;
            color: var(--text-secondary);
            text-decoration: none;
            padding: 6px 12px;
            border-radius: 8px;
            border: 1px solid transparent;
            transition: color .2s, background .2s;
        }
        .header-gh svg { width: 16px; height: 16px; }
        .header-gh:hover { color: var(--accent); background: var(--accent-light); }

        /* ── Main ─────────────────────── */
        .main {
            max-width: 840px;
            margin: 0 auto;
            padding: 56px 24px 80px;
        }

        /* ── Hero ─────────────────────── */
        .hero {
            text-align: center;
            padding: 16px 0 56px;
        }
        .hero-icon {
            width: 84px;
            height: 84px;
            margin: 0 auto 24px;
            border-radius: 24px;
            background: linear-gradient(135deg, var(--accent), #a855f7);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            box-shadow: 0 16px 40px rgba(99,102,241,.32);
            position: relative;
        }
        .hero-icon::after {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: 24px;
            box-shadow: inset 0 1px 0 rgba(255,255,255,.35);
        }
        .hero-icon svg { width: 40px; height: 40px; }
        .hero h1 {
            font-size: 1.9rem;
            font-weight: 800;
            letter-spacing: -0.6px;
            margin-bottom: 10px;
            background: linear-gradient(120deg, var(--text), var(--accent-deep));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .hero p {
            color: var(--text-secondary);
            font-size: 1rem;
        }

        /* ── Section ──────────────────── */
        .section { margin-bottom: 44px; }
        .section-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 16px;
        }
        .section-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            flex-shrink: 0;
            box-shadow: 0 0 0 4px var(--dot-halo, transparent);
        }
        .section-dot.active { --dot-halo: var(--green-bg); background: var(--green); }
        .section-dot.archived { --dot-halo: var(--amber-bg); background: var(--amber); }
        .section-title {
            font-size: 0.82rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--text-muted);
        }
        .section-count {
            font-size: 0.72rem;
            color: var(--text-muted);
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 1px 9px;
            border-radius: 20px;
        }

        /* ── Cards ────────────────────── */
        .cards { display: flex; flex-direction: column; gap: 10px; }

        .card {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 16px 18px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            text-decoration: none;
            color: var(--text);
            transition: transform .2s ease, box-shadow .2s ease, border-color .2s ease;
            position: relative;
            overflow: hidden;
        }
        .card::before {
            content: "";
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 3px;
            border-radius: 0 3px 3px 0;
            background: linear-gradient(180deg, var(--accent), #a855f7);
            opacity: 0;
            transform: scaleY(.4);
            transition: opacity .2s ease, transform .2s ease;
        }
        .card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
            border-color: #d6d9e8;
        }
        .card:hover::before { opacity: 1; transform: scaleY(1); }
        .card:active { transform: translateY(0); }

        .card-icon {
            width: 46px;
            height: 46px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            color: var(--icon-color, var(--accent));
            background: var(--icon-bg, var(--accent-light));
            transition: transform .2s ease;
        }
        .card:hover .card-icon { transform: scale(1.06); }
        .card-icon svg { width: 22px; height: 22px; }
        .card-icon.purple { --icon-color: #6366f1; --icon-bg: #eef2ff; }
        .card-icon.blue   { --icon-color: #3b82f6; --icon-bg: #eff6ff; }
        .card-icon.green  { --icon-color: #10b981; --icon-bg: #ecfdf5; }
        .card-icon.orange { --icon-color: #f97316; --icon-bg: #fff7ed; }
        .card-icon.rose   { --icon-color: #f43f5e; --icon-bg: #fff1f2; }

        .card-body { flex: 1; min-width: 0; }
        .card-title {
            font-weight: 600;
            font-size: 0.96rem;
            letter-spacing: -0.2px;
        }
        .card-desc {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .card-arrow {
            color: var(--text-muted);
            flex-shrink: 0;
            display: flex;
            transition: transform .2s, color .2s;
        }
        .card-arrow svg { width: 18px; height: 18px; }
        .card:hover .card-arrow {
            transform: translateX(3px);
            color: var(--accent);
        }

        .card-tag {
            font-size: 0.68rem;
            padding: 3px 9px;
            border-radius: 20px;
            font-weight: 600;
            letter-spacing: .4px;
            flex-shrink: 0;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }
        .card-tag::before {
            content: "";
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: currentColor;
            opacity: .8;
        }
        .card-tag.new { background: var(--green-bg); color: #059669; }
        .card-tag.paused { background: var(--amber-bg); color: #d97706; }

        /* ── Footer ───────────────────── */
        .footer {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 28px 24px;
            color: var(--text-muted);
            font-size: 0.8rem;
            border-top: 1px solid var(--border);
            margin-top: 48px;
        }
        .footer svg { width: 15px; height: 15px; }
        .footer a {
            color: var(--accent);
            text-decoration: none;
            font-weight: 500;
        }
        .footer a:hover { text-decoration: underline; }

        /* ── Responsive ───────────────── */
        @media (max-width: 600px) {
            .main { padding: 36px 16px 60px; }
            .hero { padding: 8px 0 40px; }
            .hero h1 { font-size: 1.5rem; }
            .hero-icon { width: 68px; height: 68px; border-radius: 20px; }
            .hero-icon svg { width: 32px; height: 32px; }
            .card { padding: 14px 14px; gap: 12px; }
            .card-icon { width: 40px; height: 40px; border-radius: 10px; }
            .card-icon svg { width: 19px; height: 19px; }
            .card-tag { display: none; }
        }
    </style>
</head>
